[build-system]
requires = ["meson-python >= 0.22", "Cython >= 3.3", "wheel", "numpy >= 2.5"]
build-backend = 'mesonpy'

[project]
name = "coco-experiment"
authors = [
    { name = "Asma Atamna" },
    { name = "Dimo Brockhoff" },
    { name = "Lorenzo Consoli" },
    { name = "Ouassim Ait ElHara" },
    { name = "Paul Dufossé" },
    { name = "Nikolaus Hansen" },
    { name = "Leopold Luley" },
    { name = "Olaf Mersmann" },
    { name = "Duc Manh Nguyen" },
    { name = "Phillipe R. Sampaio" },
    { name = "Marc Schoenauer" },
    { name = "Dejan Tušar" },
    { name = "Tea Tušar" },
    { name = "Konstantinos Varelas" },
]
description = 'Benchmarking framework for all types of black-box optimization algorithms.'
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy >= 1.26.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/numbbo/coco-experiment"
Documentation = "https://numbbo.github.io/coco-doc/apidocs/cocoex/"
Issues = "https://github.com/numbbo/coco-experiment/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
log_cli = true
addopts = ["--doctest-modules"]

[tool.cibuildwheel]
build-frontend = "build"
manylinux-x86_64-image = "manylinux_2_28"

[tool.hatch.build]
include = ["/src/data/*.csv"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "/src/cocoex/*.py",
    "/src/cocoex/*.pyx",
    "/src/cocoex/coco.h",
    "/src/cocoex/coco.c",
    "/tests",
    "/scripts",
    "/meson.build",
]

[tool.hatch.version]
path = "src/cocoex/_version.py"

[dependency-groups]
dev = [
    "build>=1.6",
]
