name: test-octave

on: workflow_call

jobs:
  octave-example:
    # FIXME: Should also test on windows and macos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{github.workspace}}
    steps:
      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave octave-dev
      - name: Download Octave source package
        uses: actions/download-artifact@v8
        with:
          name: dist-octave
      - name: Unpack
        run: unzip cocoex-octave-*.zip
      - name: Build
        working-directory: ${{github.workspace}}/cocoex-octave/
        # coco.cpp needs C++17, which is not the default of every compiler
        run: CXXFLAGS="$(mkoctfile -p CXXFLAGS) -std=c++17" mkoctfile --verbose --mex cocoCall.c coco.cpp
      - name: Experiment
        working-directory: ${{github.workspace}}/cocoex-octave/
        run: octave --no-gui exampleexperiment.m
      - name: Archive Octave example experiment results
        uses: actions/upload-artifact@v7
        with:
          name: octave-example
          path: cocoex-octave/exdata/*
